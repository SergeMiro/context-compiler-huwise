# PREPROD — a separate Compose project: own containers, image, database (ctxc_preprod), ES alias (cards_preprod),
# hostname and model budget. It reuses the MariaDB / Elasticsearch / Neo4j servers of the local stand (RAM), never
# their production database or index; the shared Neo4j graph is read-only from here (projections/graph.py).
# Up:   docker compose -f docker-compose.preprod.yml up -d --build
# Down: docker compose -f docker-compose.preprod.yml down          (production is not affected)
name: ctxc-preprod
services:
  mcp:
    build: .
    image: ctxc-preprod-mcp
    env_file: .env.preprod
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      ES_URL: http://es:9200
      NEO4J_URL: bolt://neo4j:7687
      DJANGO_DEBUG: "0"
      CTXC_ENV: preprod
      CTXC_MCP_ALLOWED_HOSTS: context-preprod.smiro.dev
      CTXC_LIVE_RUNS_PER_DAY: "5"
    mem_limit: 384m
    restart: unless-stopped
    networks: [stand, web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_web"
      - "traefik.http.routers.ctxc-pre-mcp.rule=Host(`context-preprod.smiro.dev`) && (PathPrefix(`/mcp`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.ctxc-pre-mcp.entrypoints=websecure"
      - "traefik.http.routers.ctxc-pre-mcp.tls.certresolver=myresolver"
      - "traefik.http.routers.ctxc-pre-mcp.middlewares=ctxc-pre-ratelimit"
      - "traefik.http.middlewares.ctxc-pre-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.ctxc-pre-ratelimit.ratelimit.burst=20"
      - "traefik.http.services.ctxc-pre-mcp.loadbalancer.server.port=8796"
  site:
    image: nginx:1.27-alpine
    volumes: [./site-preprod:/usr/share/nginx/html:ro, ./docker/site-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    mem_limit: 64m
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_web"
      - "traefik.http.routers.ctxc-pre-site.rule=Host(`context-preprod.smiro.dev`)"
      - "traefik.http.routers.ctxc-pre-site.entrypoints=websecure"
      - "traefik.http.routers.ctxc-pre-site.tls.certresolver=myresolver"
      - "traefik.http.routers.ctxc-pre-site.middlewares=ctxc-pre-ratelimit"
      - "traefik.http.services.ctxc-pre-site.loadbalancer.server.port=80"
networks:
  stand:
    name: context-compiler-huwise_default
    external: true
  web:
    name: infra_web
    external: true
