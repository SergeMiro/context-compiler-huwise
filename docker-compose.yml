# Local stand with the Huwise stack: MariaDB, RabbitMQ, Elasticsearch, Neo4j. Bound to 127.0.0.1 only.
# Up: docker compose up -d   ·   Remove with data: docker compose down -v
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ctxc
      MARIADB_USER: ctxc
      MARIADB_PASSWORD: ${DB_PASSWORD:-ctxc-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ctxc-local-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3307:3306"]
    volumes: [dbdata:/var/lib/mysql, ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-alpine
    ports: ["127.0.0.1:5673:5672"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false   # local stand only
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    mem_limit: 1536m  # 512m heap + off-heap: at 1g the container sat at 1005/1024 MiB
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-ctxc-local-pass}
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:7474 || exit 1"]
      interval: 10s
      retries: 20

  # Public read-only MCP: docker compose --profile public up -d --build mcp
  # Behind the server's traefik (network infra_web), https://context.smiro.dev/mcp and /api/* (showcase), 5 req/s per IP.
  mcp:
    profiles: [public]
    build: .
    env_file: .env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      ES_URL: http://es:9200
      NEO4J_URL: bolt://neo4j:7687
      DJANGO_DEBUG: "0"
      CTXC_MCP_ALLOWED_HOSTS: context.smiro.dev
      # the MCP tools never call a model; only /api/agent (live duel on the site) does, capped per day
      CTXC_LIVE_RUNS_PER_DAY: "15"  # free model, but the account has 1 000 free requests/day shared with other projects
    depends_on:
      mariadb: {condition: service_healthy}
      es: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    mem_limit: 384m
    restart: unless-stopped
    networks: [default, web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_web"
      - "traefik.http.routers.ctxc-mcp.rule=Host(`context.smiro.dev`) && (PathPrefix(`/mcp`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.ctxc-mcp.entrypoints=websecure"
      - "traefik.http.routers.ctxc-mcp.tls.certresolver=myresolver"
      - "traefik.http.routers.ctxc-mcp.middlewares=ctxc-ratelimit"
      - "traefik.http.middlewares.ctxc-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.ctxc-ratelimit.ratelimit.burst=20"
      - "traefik.http.services.ctxc-mcp.loadbalancer.server.port=8796"

  # Static showcase built by `manage.py build_site <domain> site/`, served at https://context.smiro.dev/
  site:
    profiles: [public]
    image: nginx:1.27-alpine
    volumes: [./site:/usr/share/nginx/html:ro, ./docker/site-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    mem_limit: 64m
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_web"
      - "traefik.http.routers.ctxc-site.rule=Host(`context.smiro.dev`)"
      - "traefik.http.routers.ctxc-site.entrypoints=websecure"
      - "traefik.http.routers.ctxc-site.tls.certresolver=myresolver"
      - "traefik.http.routers.ctxc-site.middlewares=ctxc-ratelimit"
      - "traefik.http.services.ctxc-site.loadbalancer.server.port=80"

volumes:
  dbdata:
  esdata:
  neo4jdata:

networks:
  web:
    name: infra_web
    external: true
